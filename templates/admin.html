<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Personal Blog</h1>
    <a href="{{url_for('new_article')}}"><button type="button">+ Add</button></a>
    {%if articles%}
    {%for article_id, article in articles.items()%}
    <div>
        <a href="{{ url_for('article_detail', article_id=article_id) }}">
            <p>
                <strong>{{article.get("title", "")}}</strong>
                {{article.get("date_posted", "")}}
            </p>
        </a>
        <a href="{{ url_for('edit_article', article_id=article_id) }}"><button type="button">Edit</button></a>
        <a href="{{ url_for('delete_article', article_id=article_id) }}"><button type="button">Delete</button></a>
    </div>
    {%endfor%}
    {%endif%}
</body>

</html>
